<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SoundCloud By VanHai</title>
  <link rel="stylesheet" href="popup.css">
  <script>
    // Inline iOS Bridge Shim cho WKWebView
    (function() {
      'use strict';
      if (window.__iosBridgeInitialized) return;
      window.__iosBridgeInitialized = true;

      let storageListeners = [];
      const storageShim = {
        local: {
          get: function(keys, callback) {
            let result = {};
            try {
              const raw = localStorage.getItem('sc_cue_storage');
              if (raw) result = JSON.parse(raw);
            } catch(e) {}
            if (typeof keys === 'string') {
              result = { [keys]: result[keys] };
            } else if (Array.isArray(keys)) {
              let filtered = {};
              keys.forEach(k => { filtered[k] = result[k]; });
              result = filtered;
            }
            if (callback) setTimeout(() => callback(result), 0);
          },
          set: function(items, callback) {
            try {
              let current = {};
              const raw = localStorage.getItem('sc_cue_storage');
              if (raw) current = JSON.parse(raw);
              Object.assign(current, items);
              const jsonStr = JSON.stringify(current);
              localStorage.setItem('sc_cue_storage', jsonStr);

              storageListeners.forEach(listener => {
                try {
                  let changes = {};
                  for (let k in items) changes[k] = { newValue: items[k] };
                  listener(changes, 'local');
                } catch(err){}
              });

              if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.nativeStorage) {
                window.webkit.messageHandlers.nativeStorage.postMessage(jsonStr);
              }
            } catch(e) {}
            if (callback) setTimeout(callback, 0);
          },
          clear: function(callback) {
            try {
              localStorage.removeItem('sc_cue_storage');
              if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.nativeStorage) {
                window.webkit.messageHandlers.nativeStorage.postMessage('{}');
              }
            } catch(e) {}
            if (callback) setTimeout(callback, 0);
          }
        },
        onChanged: {
          addListener: function(fn) {
            if (typeof fn === 'function') storageListeners.push(fn);
          }
        }
      };

      window.chrome = window.chrome || {};
      window.chrome.storage = storageShim;
      window.chrome.runtime = { sendMessage: function() {} };
    })();
  </script>
</head>
<body>
  <div class="popup-wrapper">
    <!-- Header Pastel Clean -->
    <div class="header">
      <div class="title-group">
        <div class="header-tag">VH</div>
        <div>
          <h3>SoundCloud By VanHai</h3>
          <span class="subtitle">Quản lý mốc thời gian chuyển bài</span>
        </div>
      </div>
      <span class="badge" id="cue-count-badge">0 bài</span>
    </div>

    <!-- Hướng dẫn nhanh -->
    <div class="quick-guide">
      <p>Make by <strong>Văn Hải</strong> v4. <strong>Antigravity VIP</strong> - Tự động tua mốc phát không delay</p>
    </div>

    <!-- Các nút Xuất / Nhập file ra ngoài máy tính -->
    <div class="io-actions" style="display: flex; gap: 6px;">
      <button id="export-json-btn" class="io-btn export-btn" title="Xuất danh sách ra file .json">
        Xuất file
      </button>
      <button id="import-json-btn" class="io-btn import-btn" title="Chọn file .json từ máy">
        Chọn file (.json)
      </button>
      <button id="paste-json-btn" class="io-btn" style="background: linear-gradient(135deg, #ff758f 0%, #ff4d6d 100%); color: white;" title="Dán trực tiếp đoạn mã JSON">
        Dán JSON
      </button>
      <input type="file" id="import-file-input" accept=".json,application/json" style="opacity: 0; position: absolute; z-index: -1; width: 1px; height: 1px; overflow: hidden;">
    </div>

    <!-- Khung nhập / dán JSON trực tiếp trên iPhone -->
    <div id="paste-modal" style="display: none; padding: 10px; background: #fff0f3; border: 1.5px solid #ffccd5; border-radius: 8px; margin: 8px 0;">
      <textarea id="paste-json-textarea" style="width: 100%; height: 70px; font-size: 11px; padding: 6px; box-sizing: border-box; border-radius: 6px; border: 1px solid #ff758f; outline: none;" placeholder="Dán nội dung file JSON vào đây..."></textarea>
      <div style="display: flex; gap: 8px; margin-top: 6px;">
        <button id="confirm-paste-btn" class="io-btn" style="flex: 1; background: #ff4d6d; color: white;">Nạp danh sách</button>
        <button id="cancel-paste-btn" class="io-btn" style="background: #e9ecef; color: #495057;">Hủy</button>
      </div>
    </div>

    <!-- Danh sách các bài đã lưu -->
    <div class="cue-list-header">
      <span>DANH SÁCH BÀI ĐÃ LƯU</span>
      <button id="clear-all-btn" title="Xóa toàn bộ danh sách">Xóa tất cả</button>
    </div>
    
    <div class="cue-list-container" id="cue-list">
      <div class="empty-state">
        <p>Chưa có bài nào được lưu.<br>Hãy mở SoundCloud và lưu mốc phát cho bài hát.</p>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <span>Tự động tua & chuyển bài không delay</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
