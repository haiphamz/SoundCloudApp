name: SoundCloudApp
options:
  bundleIdPrefix: com.vanhai
  deploymentTarget:
    iOS: "16.0"
targets:
  SoundCloudApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - Sources
    settings:
      base:
        PRODUCT_NAME: "SoundCloudApp"
        PRODUCT_BUNDLE_IDENTIFIER: com.vanhai.soundcloudapp
        INFOPLIST_KEY_CFBundleDisplayName: "SoundCloud VH"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_BITCODE: NO
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_IDENTITY: "-"
        AD_HOC_CODE_SIGNING_ALLOWED: YES
    info:
      path: Sources/Info.plist
      properties:
        CFBundleName: "SoundCloudApp"
        CFBundleDisplayName: "SoundCloud VH"
        CFBundleIdentifier: "com.vanhai.soundcloudapp"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        CFBundlePackageType: "APPL"
        LSRequiresIPhoneOS: true
        CFBundleSupportedPlatforms:
          - "iPhoneOS"
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
